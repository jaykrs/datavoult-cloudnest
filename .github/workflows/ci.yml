name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cloudnest
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/cloudnest
      SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3306/cloudnest_shadow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate schema
        run: npx prisma validate

      - name: Migrations match schema.prisma (no drift)
        # Replays every migration into the shadow DB and diffs the result with
        # schema.prisma. A non-empty diff exits non-zero and fails the build.
        run: >
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build
